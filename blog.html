<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог — Корисні статті про будівництво — БудМайстер</title>
    <meta name="description" content="Огляди інструментів, поради з ремонту, помилки при будівництві — корисні статті від БудМайстер.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="vendor/fa/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <!-- HERO сторінки -->
    <section class="page-hero">
        <div class="page-hero-inner">
            <nav class="breadcrumbs"><a href="index.html">Головна</a> / <span>Блог</span></nav>
            <h1>Корисні <span style="color:var(--primary)">поради</span></h1>
            <p>Огляди матеріалів та інструменту, лайфхаки прорабів, типові помилки ремонту — щось знайдете й для себе.</p>
        </div>
    </section>

    <!-- Список статей з фільтром по категоріях -->
    <section class="blog-list-section">
        <!-- Фільтр-чіпи по категоріях -->
        <div class="blog-categories">
            <button class="blog-cat-btn active" data-cat="all" onclick="filterBlogCat(event, 'all')">Всі</button>
            <button class="blog-cat-btn" data-cat="Будівництво" onclick="filterBlogCat(event, 'Будівництво')">Будівництво</button>
            <button class="blog-cat-btn" data-cat="Ремонт" onclick="filterBlogCat(event, 'Ремонт')">Ремонт</button>
            <button class="blog-cat-btn" data-cat="Інструмент" onclick="filterBlogCat(event, 'Інструмент')">Інструмент</button>
        </div>

        <!-- Сітка карток (рендериться з js.js → BLOG_POSTS) -->
        <div class="blog-list-grid" id="blog-list-grid"></div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="js/api.js"></script>
    <script src="js/js.js"></script>
</body>

</html>
