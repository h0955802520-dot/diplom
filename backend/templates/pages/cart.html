<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик — БудМайстер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/vendor/fa/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="cart-page-container">
        <h2 class="cart-page-title">Кошик</h2>

        <div id="cart-items-container" class="cart-items-wrapper"></div>

        <div id="cart-footer" class="cart-footer">
            <div class="cart-subtotal-row">
                <span class="cart-subtotal-label">До сплати (без доставки):</span>
                <span id="cart-subtotal-value" class="cart-subtotal-value">0 грн</span>
            </div>
            <div class="cart-footer-buttons">
                <a href="shop.html" class="btn-secondary"><i class="fa fa-arrow-left"></i> Продовжити покупки</a>
                <a href="checkout.html" id="goto-checkout-btn" class="btn-primary"><i class="fa fa-check"></i> Перейти до оформлення</a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/js.js"></script>
    <script>
        // Рендер кошика (список товарів + підсумок без доставки)
        function renderCartPage() {
            const container = document.getElementById('cart-items-container');
            const footer = document.getElementById('cart-footer');
            if (!container) return;
            cart = JSON.parse(localStorage.getItem('budMasterCart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart-container">
                        <i class="fa fa-shopping-cart" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
                        <h3 class="empty-cart-title">Ваш кошик порожній</h3>
                        <a href="shop.html" class="btn-primary">До каталогу</a>
                    </div>`;
                if (footer) footer.style.display = 'none';
                return;
            }

            let html = '';
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                const promoBadge = item.promo ? '<span class="cart-promo-badge">Знижка</span>' : '';
                const popBadge = item.popular ? '<span class="cart-popular-badge">Хіт</span>' : '';
                const oldPriceHtml = item.oldPrice ? `<span class="cart-item-old-price">${item.oldPrice} грн</span>` : '';

                html += `
                <div class="cart-item-row">
                    <img src="${item.img}" alt="${item.name}" class="cart-item-img">
                    <div class="cart-item-info">
                        <div style="margin-bottom: 5px;">${promoBadge} ${popBadge}</div>
                        <h4 class="cart-item-title">${item.name}</h4>
                        <p class="cart-item-price">${oldPriceHtml}${item.price} грн / шт</p>
                    </div>
                    <div class="cart-controls">
                        <button class="cart-control-btn" type="button" onclick="changeQty('${item.id}', -1)">-</button>
                        <span class="cart-control-qty">${item.quantity}</span>
                        <button class="cart-control-btn" type="button" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                    <div class="cart-item-total">${itemTotal} грн</div>
                    <button class="cart-delete-btn" type="button" onclick="removeFromCart('${item.id}')" title="Видалити">
                        <i class="fa fa-trash"></i>
                    </button>
                </div>`;
            });

            container.innerHTML = html;

            // Підрахунок суми
            const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            document.getElementById('cart-subtotal-value').textContent = subtotal + ' грн';

            // Кнопка оформлення — блокуємо при мін. сумі
            const goBtn = document.getElementById('goto-checkout-btn');
            if (subtotal < MIN_ORDER) {
                goBtn.classList.add('disabled');
                goBtn.setAttribute('aria-disabled', 'true');
                goBtn.onclick = (e) => { e.preventDefault(); showToast(`Мінімальна сума: ${MIN_ORDER} грн`); };
            } else {
                goBtn.classList.remove('disabled');
                goBtn.removeAttribute('aria-disabled');
                goBtn.onclick = null;
            }

            if (footer) footer.style.display = '';
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            localStorage.setItem('budMasterCart', JSON.stringify(cart));
            updateCartBadge();
            renderCartPage();
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) { removeFromCart(id); return; }
            localStorage.setItem('budMasterCart', JSON.stringify(cart));
            updateCartBadge();
            renderCartPage();
        }

        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
</body>

</html>
