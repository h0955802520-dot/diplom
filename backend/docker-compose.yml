services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budmaster
      POSTGRES_USER: budmaster
      POSTGRES_PASSWORD: budmaster
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budmaster -d budmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://budmaster:budmaster@db:5432/budmaster
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
      - media:/app/media

volumes:
  pgdata:
  media:
