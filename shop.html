<!DOCTYPE html>
<html lang="ukr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — БудМайстер</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">Буд<span>Майстер</span></a>

            <nav id="menu">
                <form class="search-box" onsubmit="handleSearch(event)">
                    <input type="text" placeholder="Пошук матеріалів..." required>
                    <button type="submit"><i class="fa fa-search"></i></button>
                </form>

                <a href="cart.html" class="cart">
                    <i class="fa fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>

                <ul>
                    <li><a href="index.html">Головна</a></li>
                    <li><a href="about.html">Про нас</a></li>
                    <li><a href="shop.html">Каталог</a></li>
                    <li><a href="contacts.html">Контакти</a></li>
                </ul>
            </nav>

            <div class="burger" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
                <i class="fa fa-times"></i>
            </div>
        </div>
    </header>

    <div class="shop-layout">
        <aside class="sidebar-filters custom-form">
            <h3 style="margin-bottom: 20px;">Фільтри</h3>

            <div class="filter-group">
                <label>Пошук по назві:</label>
                <input type="text" id="sidebar-search" placeholder="Введіть назву товару..." oninput="renderShop()">
            </div>

            <div class="filter-group">
                <label>Категорія:</label>
                <select id="f-type" onchange="renderShop()">
                    <option value="all">Всі категорії</option>
                    <option value="cement">Цемент та суміші</option>
                    <option value="brick">Цегла та блоки</option>
                    <option value="tool">Інструменти</option>
                    <option value="paint">Фарби та лаки</option>
                    <option value="metal">Металопрокат</option>
                    <option value="electric">Електрика</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Тип робіт:</label>
                <select id="f-category" onchange="renderShop()">
                    <option value="all">Всі</option>
                    <option value="construction">Будівництво</option>
                    <option value="finishing">Оздоблення</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Сортування ціни:</label>
                <select id="f-price" onchange="renderShop()">
                    <option value="default">За замовчуванням</option>
                    <option value="low">Від дешевих до дорогих</option>
                    <option value="high">Від дорогих до дешевих</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Бренд:</label>
                <select id="f-brand" onchange="renderShop()">
                    <option value="all">Всі бренди</option>
                    <option value="knauf">Knauf</option>
                    <option value="bosch">Bosch</option>
                    <option value="makita">Makita</option>
                    <option value="henkel">Henkel</option>
                    <option value="sniezka">Sniezka</option>
                    <option value="dewalt">DeWalt</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Фасування:</label>
                <select id="f-age" onchange="renderShop()">
                    <option value="all">Будь-яке</option>
                    <option value="small">До 5 кг / шт</option>
                    <option value="medium">5-25 кг</option>
                    <option value="large">Понад 25 кг</option>
                </select>
            </div>

            <div class="filter-group" style="gap: 15px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none;">
                    <input type="checkbox" id="f-promo" onchange="renderShop()" style="width: auto;"> Акційні товари
                </label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none;">
                    <input type="checkbox" id="f-popular" onchange="renderShop()" style="width: auto;"> Хіти продажів
                </label>
            </div>
        </aside>

        <div class="shop-content">
            <div class="products-grid" id="shop-grid" style="padding: 0; margin: 0;"></div>
        </div>
    </div>

    <footer>
        <div class="container" style="flex-direction: column;">
            <ul class="footer-links">
                <li><a href="index.html">Головна</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="shop.html">Каталог</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
            <p class="copyright">&copy; 2026 БудМайстер. Будівельні матеріали та інструменти. Всі права захищені.</p>
        </div>
    </footer>

    <script src="js/js.js"></script>
</body>

</html>
